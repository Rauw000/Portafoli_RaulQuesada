spring.application.name=Portafolio

#para definir el puert donde "escuchara" el servidor 
server.port=80

#para definir el formato de despliegue de fecha/hora dell log en la consola 
logging.pattern.dateformat=hh:mm

#para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache"del servidor (false), en produccion "true"
spring.thymeleaf.cache=false

