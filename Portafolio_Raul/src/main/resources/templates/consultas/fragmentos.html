<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/plantilla :: head}"/>
    <body>
        <!-- fragmento 1 para Agregar producto en ventana modal -->
        <section th:fragment="tabs" class="py-3 mb-4">
            <div class="d-flex justify-content-center px-5"> 
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a th:href="@{/}" 
                           th:classappend="${idCategoriaActual == null} ? 'active'"
                           class="nav-link" 
                           aria-current="page">
                            [[#{pruebas.todas}]]
                        </a>
                    </li>
                    <li th:each="c : ${categorias}" class="nav-item">
                        <a th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                           th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                           class="nav-link">
                            [[${c.descripcion}]]
                        </a>
                    </li>
                </ul>
            </div>
        </section>

        <!-- fragmento 2 para el listado de tarjetas de productos -->
        <section th:fragment="tarjetas(mostrarCarrito)" class="container py-4">
            <p th:if="${productos == null or productos.empty}"
               class="text-center">
                No hay productos para mostrar.
            </p>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="p : ${productos}" class="col">
                    <div class="card h-100 shadow-sm">
                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height: 200px;">
                            <img th:src="${p.rutaImagen}" class="img-fluid" 
                                 th:alt="${p.descripcion}" 
                                 style="max-height: 100%; object-fit: contain;"/>
                        </div>
                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0" th:text="${p.descripcion}">Título</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate" th:text="${p.detalle}">Detalle</p>
                        </div>
                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <div class="fw-bold">
                                <span class="text-success h5" th:text="${#numbers.formatCurrency(p.precio)}">$99.99</span>
                                <span th:if="${p.existencias > 0}" class="badge text-bg-success ms-2" th:text="${p.existencias} + ' unidades'"></span>
                                <span th:unless="${p.existencias > 0}" class="badge text-bg-danger ms-2">Agotado</span>
                            </div>
                            <form th:if="${mostrarCarrito}" th:action="@{/carrito/agregar}" th:method="POST" class="d-inline">
                                <input type="hidden" th:value="${p.idProducto}" name="idProducto"/>
                                <button type="submit" 
                                        class="btn btn-sm btn-primary" 
                                        th:disabled="${p.existencias == 0}"
                                        onclick="addCart(this.form)">
                                    <i class="fas fa-cart-plus"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>


        <!-- Fragmento de consultas -->
        <section th:fragment="consultas" class="container py-4">

            <h2 class="text-center mb-4">Consultas de productos</h2>

            <div class="row g-3">

                <div th:replace="~{consultas/fragmentos :: formConsulta('primary', 'Consulta derivada', '/consultas/consultaDerivada')}"></div>

                <div th:replace="~{consultas/fragmentos :: formConsulta('success', 'Consulta JPQL', '/consultas/consultaJPQL')}"></div>

                <div th:replace="~{consultas/fragmentos :: formConsulta('info', 'Consulta SQL', '/consultas/consultaSQL')}"></div>

                <div th:replace="~{consultas/fragmentos :: formInventario('warning', 'Consulta por existencias', '/consultas/consultaBajoInventario')}"></div>
            </div>


        </section>

        <!-- Formulario reutilizable -->
        <div th:fragment="formConsulta(colorForm, textoForm, urlForm)"
             class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-header"
                     th:classappend="'bg-' + ${colorForm}">
                    <h5 th:text="${textoForm}">Consulta</h5>
                </div>

                <div class="card-body">
                    <form th:action="@{${urlForm}}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Precio inferior</label>
                            <input type="number"
                                   name="precioInf"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio superior</label>
                            <input type="number"
                                   name="precioSup"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   required />
                        </div>

                        <button type="submit"
                                class="btn w-100"
                                th:classappend="'btn-' + ${colorForm}">
                            Buscar
                        </button>

                    </form>
                </div>
            </div>
        </div>
        
        <!-- Formulario de consulta por existencias -->
        <div th:fragment="formInventario(colorForm, textoForm, urlForm)"
             class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-header"
                     th:classappend="'bg-' + ${colorForm}">
                    <h5 th:text="${textoForm}">Consulta</h5>
                </div>

                <div class="card-body">
                    <form th:action="@{${urlForm}}" method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                Cantidad máxima de existencias
                            </label>

                            <input type="number"
                                   name="existencias"
                                   class="form-control"
                                   min="0"
                                   step="1"
                                   required />
                        </div>

                        <button type="submit"
                                class="btn w-100"
                                th:classappend="'btn-' + ${colorForm}">
                            Buscar
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
